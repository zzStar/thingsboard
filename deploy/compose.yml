name: zhigong-things
services:
  postgres:
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: &logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
  thingsboard:
    image: ${APP_IMAGE:?required}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thingsboard
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      TB_QUEUE_TYPE: in-memory
      JS_EVALUATOR: local
      HTTP_BIND_ADDRESS: 0.0.0.0
      HTTP_BIND_PORT: "8080"
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx1536m -XX:ActiveProcessorCount=2
      TB_LICENSE_INSTANCE_DATA_FILE: /data/instance-license.data
    volumes:
      - app-data:/data
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 2304m
    stop_grace_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: *logging
volumes:
  postgres-data:
  app-data:
  caddy-data:
  caddy-config:
