name: thingsboard-source-dev
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: thingsboard_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${TB_DEV_DB_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres-data:
